<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Update Blog Post</h1>
    <div class="post">
        <form action="{{ url_for('update', post_id=post.id) }}" method="POST">
            <label for="author">Author:</label><br>
            <input type="text" id="author" name="author" value="{{ post.author }}" required style="width: 100%; margin-bottom: 10px;"><br>
            
            <label for="title">Title:</label><br>
            <input type="text" id="title" name="title" value="{{ post.title }}" required style="width: 100%; margin-bottom: 10px;"><br>
            
            <label for="content">Content:</label><br>
            <textarea id="content" name="content" rows="5" required style="width: 100%; margin-bottom: 10px;">{{ post.content }}</textarea><br>
            
            <button type="submit" style="padding: 10px 15px;">Update Post</button>
        </form>
        <br>
        <a href="{{ url_for('index') }}">Cancel and return to home</a>
    </div>
</body>
</html>
