<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="{{ url_for('add') }}" style="font-size: 1.2em; font-weight: bold;">+ Add a New Blog Post</a>
    </div>

    {% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p><em>Written by {{ post.author }}</em></p>
        <p>{{ post.content }}</p>
        
        <!-- Action Buttons & Like Counter -->
        <div style="margin-top: 15px;">
            <a href="{{ url_for('like', id=post.id) }}" 
               style="color: white; background-color: #008CBA; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 0.9em; margin-right: 10px;">
               👍 Like ({{ post.get('likes', 0) }})
            </a>
            <a href="{{ url_for('update', post_id=post.id) }}" 
               style="color: white; background-color: #4CAF50; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 0.9em; margin-right: 10px;">
               Update Post
            </a>
            <a href="{{ url_for('delete', post_id=post.id) }}" 
               style="color: white; background-color: #ff4c4c; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 0.9em;">
               Delete Post
            </a>
        </div>
    </div>
    {% else %}
    <div class="post">
        <p>No posts available yet. Be the first to add one!</p>
    </div>
    {% endfor %}
</body>
</html>
